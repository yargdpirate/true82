<style>

</style></head>
<body>
<h1>Verify tokenized snapshots</h1>
<p class="dim" id="sub">Identity: tokenized page with no theme must compute the same colors as the real page. Coverage: with every role set to a probe color, any color that stays the same was missed by the tokenizer.</p>
<p id="status">starting</p>
<div class="stats" id="stats"></div>
<div id="out"></div>
<h2>Log</h2>
<div id="log"></div>
<div id="frames"></div>
<script src="../tokenize.js"></script>

    $("stats").innerHTML = stat("snapshots checked", S.snapshots, !S.errors) + stat("identity mismatches", S.identityMismatches, !S.identityMismatches) + stat("structure differences", S.structural, !S.structural) +
      stat("missed colors (groups)", S.missGroups, !S.missGroups) + stat("colors in SVG data URIs", S.dataUriGroups, !S.dataUriGroups) + stat("fixed on purpose (groups)", S.fixedGroups, true) +
      stat("browser defaults", S.uaGroups, true) + stat("literals left, not fixed", S.staticMissed, !S.staticMissed) + stat("snapshots not tokenized yet", S.missingTok, !S.missingTok);
    var h = "";
    if (r.missingTok.length) h += '<h2>Not tokenized yet</h2><p class="warn">' + r.missingTok.map(esc).join(", ") + '</p><p class="dim">Run tokenize.html?only=' + esc(r.missingTok.join(",")) + "</p>";
    // identity
    h += "<h2>Identity</h2>";
    var bad = r.snapshots.filter(function (s) { return (s.identity || []).length || (s.structural || []).length || s.error; });
    var noRaw = r.snapshots.filter(function (s) { return s.noRaw; }).map(function (s) { return s.name; });
    if (noRaw.length) h += '<p class="dim">No real snapshot to compare (built straight into /snaps/tok, coverage only): ' + esc(noRaw.join(", ")) + "</p>";
    if (!bad.length) h += '<p class="ok">Every tokenized snapshot computes the same colors as the real page (' + r.snapshots.reduce(function (s, x) { return s + (x.checks || 0); }, 0) + " property checks).</p>";
    bad.forEach(function (s) {
      h += "<details open><summary>" + esc(s.name) + ": " + (s.error ? '<span class="bad">error ' + esc(s.error) + "</span>" : (s.identity.length + " mismatches, " + s.structural.length + " structure")) + "</summary><table><tr><th>element</th><th>property</th><th>real</th><th>tokenized</th></tr>";
      (s.identity || []).slice(0, 60).forEach(function (m) { h += '<tr><td class="wrap">' + esc(m.el + (m.pseudo || "")) + "</td><td>" + esc(m.prop) + '</td><td class="wrap">' + esc(m.raw) + '</td><td class="wrap">' + esc(m.tok) + "</td></tr>"; });
      (s.structural || []).forEach(function (m) { h += '<tr><td class="wrap">' + esc(m.at) + "</td><td>structure</td><td>" + esc(m.raw) + "</td><td>" + esc(m.tok) + "</td></tr>"; });
      h += "</table></details>";
    });
    // coverage
    var titles = { css: "Missed in CSS rules", inline: "Missed in inline styles", "svg-attr": "Missed in SVG attributes", unknown: "Unchanged, source not found", "data-uri": "Colors inside SVG data URIs (var() cannot reach them)", hidden: "Unchanged but invisible in the snapshot (opacity 0)", fixed: "Fixed on purpose (role fixed)", ua: "Browser defaults (not a site color)" };
    ["css", "inline", "svg-attr", "unknown", "data-uri", "hidden", "fixed", "ua"].forEach(function (kind) {
      var gs = r.misses.filter(function (g) { return g.kind === kind; });
      h += "<h2>" + titles[kind] + " (" + gs.length + ")</h2>";
      if (!gs.length) { h += '<p class="ok">none</p>'; return; }
      h += "<table><tr><th>color</th><th>source</th><th>property</th><th>seen</th><th>examples</th></tr>";
      gs.forEach(function (g) {
        var snaps = Object.keys(g.snaps);
        h += "<tr><td>" + sw(resolveColor(String(g.lit).replace(/^%23/, "#"))) + esc(g.lit) + '</td><td class="wrap">' + esc((g.sheet ? g.sheet + "  " : "") + g.sel) + (g.via ? ' <span class="dim">(via ' + esc(g.via) + ")</span>" : "") + "</td><td>" + esc(g.prop) + (Object.keys(g.props).length && !g.props[g.prop] ? ' <span class="dim">(' + esc(Object.keys(g.props).join(", ")) + ")</span>" : "") +
          "</td><td>" + g.n + "x in " + snaps.length + ' <details><summary class="dim">snapshots</summary>' + esc(snaps.join(", ")) + '</details></td><td class="wrap dim">' + esc(g.examples.join("  ")) + "</td></tr>";
      });
      h += "</table>";
    });
    // static
    var sm = r.static.filter(function (g) { return !g.fixed; }), sf = r.static.filter(function (g) { return g.fixed; });
    h += "<h2>Literals left in the tokenized sources (" + sm.length + " not fixed, " + sf.length + " fixed)</h2>";
    h += '<p class="dim">Every color literal still outside a role variable in site.tok.css and in the tokenized snapshots (style blocks, style attributes, SVG attributes), including states no snapshot shows.</p>';
    h += "<table><tr><th>color</th><th>where</th><th>selector</th><th>role</th><th>snapshots</th></tr>";
    sm.concat(sf).forEach(function (g) {
      h += "<tr><td>" + sw(resolveColor(g.lit)) + esc(g.lit) + "</td><td>" + esc(g.where) + '</td><td class="wrap">' + esc(g.sel) + "</td><td>" + (g.fixed ? '<span class="dim">fixed</span>' : '<span class="bad">missed</span>') + '</td><td class="dim">' + (g.snaps.length ? g.snaps.length : "") + "</td></tr>";
    });
    h += "</table>";
    // pairs
    h += "<h2>Text on background, by role</h2><p class=\"dim\">Every visible text element: the role of its color on the role of the surface behind it. Rows marked check look like a role used in the wrong place.</p>";
    h += "<table><tr><th>text</th><th>on</th><th>count</th><th>check</th><th>examples</th></tr>";
    r.pairs.forEach(function (p) {
      h += "<tr><td>" + esc(p.fg) + "</td><td>" + esc(p.bg) + "</td><td>" + p.n + " in " + p.snaps.length + "</td><td>" + (p.check ? '<span class="warn">' + esc(p.check) + "</span>" : "") + '</td><td class="wrap dim">' + esc(p.examples.join("  ")) + "</td></tr>";
    });
    h += "</table>";
    // roles
    h += "<h2>Roles seen on screen</h2><table><tr><th>role</th><th>probe</th><th>uses</th><th>today's colors</th><th>top places</th></tr>";
    Object.keys(r.roleUse).forEach(function (role) {
      var u = r.roleUse[role], cols = Object.keys(u.colors).sort(function (a, b) { return u.colors[b] - u.colors[a]; }).slice(0, 8);
      h += "<tr><td>" + esc(role) + "</td><td>" + sw(PROBE[role] || "#000") + "</td><td>" + u.n + "</td><td>" + cols.map(function (c) { return sw(resolveColor(c.split("@")[0])) + esc(c); }).join(" ") + '</td><td class="wrap dim">' + esc(u.where.slice(0, 6).map(function (w) { return w.at; }).join("  ")) + "</td></tr>";
    });
    h += "</table>";
    $("out").innerHTML = h;
  }

  run().catch(function (e) { log("FATAL " + (e && e.stack || e)); status("failed"); window.VERIFY_DONE = true; });
})();
</script>
</body></html>
