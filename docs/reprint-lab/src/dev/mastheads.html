<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every masthead</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  body { margin: 0; background: #1B1E26; color: #F1EADB; font: 13px/1.4 "IBM Plex Mono", monospace; padding: 22px; }
  h1 { margin: 0 0 16px; font: 900 40px/.9 "Big Shoulders Display", sans-serif; text-transform: uppercase; text-shadow: 3px 2px 0 #FF48B0; }
  .g { display: grid; grid-template-columns: repeat(var(--cols, 2), 380px); gap: 18px 16px; }
  figure { margin: 0; display: grid; gap: 6px; }
  canvas { width: 380px; height: auto; display: block; box-shadow: 0 10px 24px -14px #000; }
  figcaption b { font: 800 19px/1 "Big Shoulders Display", sans-serif; text-transform: uppercase; letter-spacing: .03em; }
  figcaption span { display: block; color: #AFA8B8; font-size: 11.5px; }
</style></head>
<body><h1>Seventeen mastheads</h1><div class="g" id="g"></div>
<script src="loader.js"></script>
<script>
/* Every preset's masthead in a grid. ?cols=2 . window.MAST_DONE when printed. */
(function () {
  function load(f) { return new Promise(function (res) { var s = document.createElement("script"); s.src = f + "?t=" + Date.now(); s.onload = res; s.onerror = res; document.head.appendChild(s); }); }
  var q = new URLSearchParams(location.search); document.getElementById("g").style.setProperty("--cols", q.get("cols") || 2);
  LAB_READY.then(function () {
    return fetch("../app/", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (h) { var m, re = /href="(presets-[^"?#]+\.js)"/g, more = []; while ((m = re.exec(h))) more.push("../app/" + m[1]); return more.sort(); });
  }).then(function (more) { return more.concat(["../app/presets.js"]).reduce(function (p, f) { return p.then(function () { return load(f); }); }, Promise.resolve()); })
  .then(function () {
    var g = document.getElementById("g"), chain = Promise.resolve();
    LAB.presets.forEach(function (p) {
      var f = document.createElement("figure"), c = document.createElement("canvas"), cap = document.createElement("figcaption");
      cap.innerHTML = "<b></b><span></span>"; cap.firstChild.textContent = p.name; cap.lastChild.textContent = p.line || "";
      f.appendChild(c); f.appendChild(cap); g.appendChild(f);
      chain = chain.then(function () { return LAB.print(Object.assign({}, LAB.recipe(p.rc), { motion: "none" }), { cssW: 380, dpr: 2 }).then(function (pr) { c.width = pr.w; c.height = pr.h; pr.draw(c.getContext("2d"), null, null); }); });
    });
    chain.then(function () { window.MAST_DONE = true; });
  });
})();
</script>
</body></html>
