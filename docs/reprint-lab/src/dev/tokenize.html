<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tokenize snapshots</title>
<style>body{font:12px/1.5 ui-monospace,Menlo,monospace;background:#1b1b1e;color:#ddd;padding:12px}.bad{color:#ff8a8a}</style></head>
<body><h1 id="h">tokenizing</h1><pre id="log"></pre>
<script src="../tokenize.js"></script>
<script>
/* For every snapshot in /snaps/: drop the retired Tribune, point the site CSS
   at the tokenized build, tokenize inline <style> blocks, style="" attributes
   and SVG color attributes (as zero-specificity rules, see below), re-encode
   opaque canvas images as JPEG, and save to /snaps/tok/<name>.html.
   Also writes /snaps/tok/_report.json and _decisions.json (every literal -> role).
   ?only=a,b limits the run (the report and decisions of other snapshots are kept). */
var log = function (s, bad) { var p = document.getElementById("log"); var d = document.createElement("div"); if (bad) d.className = "bad"; d.textContent = s; p.appendChild(d); };
var SKIP = /^(00-test|tribune-|presti-tribune-|daily-tribune-|e404-tribune)/;
async function list() {
  var html = await (await fetch("/snaps/", { cache: "no-store" })).text(), out = [], re = /href="([^"]+)\.html"/g, m;
  while ((m = re.exec(html))) out.push(decodeURIComponent(m[1]));
  return out.filter(function (n) { return !SKIP.test(n) && n.indexOf("/") < 0; });
}
function imgAlphaFree(img) {
  var c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
  var x = c.getContext("2d"); x.drawImage(img, 0, 0);
  var d = x.getImageData(0, 0, c.width, c.height).data;
  for (var i = 3; i < d.length; i += 4 * 7) if (d[i] < 250) return null;
  return c;
}
function loadImg(src) { return new Promise(function (res) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = function () { res(null); }; i.src = src; }); }
async function run() {
  var entries = await (await fetch("/lab/build/role-entries.json", { cache: "no-store" })).json();
  var index = new T82TOK.Index(entries);
  var q = new URLSearchParams(location.search), only = q.get("only") ? q.get("only").split(",") : null;
  var names = (await list()).filter(function (n) { return !only || only.indexOf(n) >= 0; });
  document.getElementById("h").textContent = "tokenizing " + names.length;
  var total = { n: 0 }, report = {}, decisions = {};
  if (only) {
    // a partial run keeps the other snapshots' report and decisions
    try { report = await (await fetch("/snaps/tok/_report.json", { cache: "no-store" })).json(); } catch (e) { report = {}; }
    try { (await (await fetch("/snaps/tok/_decisions.json", { cache: "no-store" })).json()).forEach(function (d) { decisions[d.sel + "|" + d.prop + "|" + d.lit] = d; }); } catch (e) {}
  }
  for (var k = 0; k < names.length; k++) {
    var name = names[k], src = await (await fetch("/snaps/" + name + ".html", { cache: "no-store" })).text();
    var doc = new DOMParser().parseFromString(src, "text/html"), st = { n: 0, all: [] };
    doc.querySelectorAll(".np-overlay").forEach(function (e) { e.remove(); });
    doc.querySelectorAll('link[rel="stylesheet"]').forEach(function (l) { if (/styles\.css/.test(l.getAttribute("href") || "")) { l.setAttribute("href", "http://localhost:8091/lab/build/site.tok.css"); l.setAttribute("data-lab-site", ""); } });
    doc.querySelectorAll("style").forEach(function (s) { if (s.id === "lab-comp") return; s.textContent = T82TOK.tokenizeCSS(s.textContent, index, { stats: st }).css; });
    doc.querySelectorAll("[style]").forEach(function (e) {
      var hint = e.tagName.toLowerCase() + (e.classList.length ? "." + [].join.call(e.classList, ".") : "");
      e.setAttribute("style", T82TOK.tokenizeInline(e.getAttribute("style"), index, hint, st));
    });
    // SVG presentation attributes cannot hold var(). Re-state each color as a zero-specificity rule keyed by the
    // attribute value (the same form build-css.js appends to site.tok.css), placed first in <head>: like a
    // presentation attribute, any site rule still wins over it (an inline style would not). The markup is untouched,
    // so pieces copied out of a snapshot keep working wherever site.tok.css or this block is present.
    var svgRules = {};
    doc.querySelectorAll("[fill],[stroke],[stop-color],[flood-color]").forEach(function (e) {
      ["fill", "stroke", "stop-color", "flood-color"].forEach(function (a) {
        var v = e.getAttribute(a); T82TOK.COLOR_RE.lastIndex = 0;
        if (!v || !T82TOK.COLOR_RE.test(v)) { T82TOK.COLOR_RE.lastIndex = 0; return; }
        T82TOK.COLOR_RE.lastIndex = 0;
        var key = a + "|" + v.trim().toLowerCase(); if (svgRules[key] !== undefined) return;
        var t = T82TOK.tokenizeValue(v.trim(), index, { sel: "svg-attr " + e.tagName.toLowerCase() + (e.getAttribute("class") ? "." + e.getAttribute("class").trim().split(/\s+/).join(".") : ""), prop: a }, st);
        svgRules[key] = t !== v.trim() ? ':where([' + a + '="' + v.trim().replace(/"/g, "") + '" i]) { ' + a + ": " + t + "; }" : "";
      });
    });
    var svgCss = Object.keys(svgRules).map(function (k) { return svgRules[k]; }).filter(Boolean);
    if (svgCss.length) {
      var sr = doc.createElement("style"); sr.id = "t-svg-attrs"; sr.textContent = svgCss.join("\n");
      doc.head.insertBefore(sr, doc.head.firstChild);
    }
    // opaque canvas images -> JPEG
    var imgs = doc.querySelectorAll("img[data-snap-canvas]"), saved = 0;
    for (var i = 0; i < imgs.length; i++) {
      var s0 = imgs[i].getAttribute("src") || "";
      if (s0.indexOf("data:image/png") !== 0) continue;
      var im = await loadImg(s0); if (!im) continue;
      var c = imgAlphaFree(im);
      if (c) { var j = c.toDataURL("image/jpeg", 0.86); if (j.length < s0.length) { saved += s0.length - j.length; imgs[i].setAttribute("src", j); } }
    }
    var out = "<!doctype html>\n" + doc.documentElement.outerHTML;
    var r = await fetch("http://localhost:8091/snap/tok/" + name + ".html", { method: "POST", body: out });
    total.n += st.n;
    st.all.forEach(function (d) { var k = d.sel + "|" + d.prop + "|" + d.lit, o = decisions[k]; if (!o) o = decisions[k] = { sel: d.sel, prop: d.prop, lit: d.lit, role: d.role, how: d.how, n: 0, snaps: [] }; o.n++; if (o.snaps.indexOf(name) < 0 && o.snaps.length < 50) o.snaps.push(name); });
    report[name] = { literals: st.n, guesses: (st.guesses || []).length, bytes: out.length, jpegSaved: saved };
    log(name + "  literals " + st.n + "  by " + JSON.stringify({ spv: st.spv, value: st.value, hex: st.hex, guess: st.guess }) + "  " + Math.round(out.length / 1024) + "KB  (jpeg saved " + Math.round(saved / 1024) + "KB)");
    (st.guesses || []).slice(0, 8).forEach(function (g) { log("   GUESS " + g.lit + " -> " + g.role + "  " + (g.sel || "") + " " + g.prop, true); });
  }
  await fetch("http://localhost:8091/snap/tok/_report.json", { method: "POST", body: JSON.stringify(report, null, 1) });
  await fetch("http://localhost:8091/snap/tok/_decisions.json", { method: "POST", body: JSON.stringify(Object.keys(decisions).map(function (k) { return decisions[k]; })) });
  document.getElementById("h").textContent = "done: " + names.length + " snapshots, " + total.n + " literals";
  window.TOK_DONE = true;
}
run().catch(function (e) { log(String(e && e.stack || e), true); });
</script></body></html>
