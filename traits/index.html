<style>
  :root {
    --ink: #101418;
    --panel: #161c23;
    --panel-2: #1c242d;
    --line: #2a333d;
    --gold: #FFB52E;
    --ember: #E5533C;
    --slate: #8b98a5;
    --paper: #f2ede2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Barlow', system-ui, sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--gold); }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .disp { font-family: 'Barlow Condensed', 'Barlow', sans-serif; }

  header.tr-head {
    text-align: center;
    padding: 14px 16px 4px;
  }
  .tr-wordmark {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .22em;
    color: var(--slate);
    text-decoration: none;
  }
  .tr-wordmark b { color: var(--gold); }
  .tr-title {
    margin: 6px 0 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 8vw, 42px);
    letter-spacing: .06em;
    line-height: 1;
  }
  .tr-strap {
    margin: 0 auto;
    max-width: 380px;
    font-size: 13.5px;
    color: var(--slate);
  }
  .tr-strap b { color: var(--paper); font-weight: 500; }

  main#stage {
    flex: 1;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 14px 18px;
    display: flex;
    flex-direction: column;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  .q-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: .14em;
    color: var(--slate);
  }
  .q-top .prog { font-family: 'IBM Plex Mono', monospace; }
  .q-season {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: .12em;
  }
  .q-player {
    margin: 2px 0 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 9.5vw, 50px);
    line-height: .98;
    letter-spacing: .01em;
  }
  .q-player a { color: inherit; text-decoration: none; border-bottom: 2px solid rgba(255,181,46,.45); }
  .q-player a:active { color: var(--gold); }
  .q-trait {
    margin: 12px 0 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 6vw, 28px);
    letter-spacing: .1em;
    color: var(--gold);
  }
  .q-def {
    margin: 6px 0 0;
    font-size: 14.5px;
    line-height: 1.4;
    color: #cfd6dc;
    min-height: 2.6em;
  }

  .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .vote-btn {
    appearance: none;
    border: 0;
    border-radius: 12px;
    padding: 18px 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: .12em;
    cursor: pointer;
    transition: transform .06s ease, filter .12s ease;
  }
  .vote-btn:active { transform: scale(.97); }
  .vote-btn:disabled { opacity: .45; cursor: default; }
  .vote-yes { background: var(--gold); color: #221a05; }
  .vote-no { background: var(--ember); color: #2a0d07; }
  .vote-unsure {
    grid-column: 1 / -1;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--slate);
    font-size: 16px;
    padding: 12px 8px;
    letter-spacing: .16em;
  }
  .vote-note { margin: 10px 0 0; text-align: center; font-size: 12px; color: var(--slate); min-height: 1.2em; }
  .vote-note.err { color: var(--ember); }

  /* Reveal */
  .rv-line {
    margin: 14px 0 0;
    font-size: 15px;
    line-height: 1.45;
  }
  .rv-line b.pct { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-weight: 600; }
  .bar-wrap { position: relative; margin-top: 14px; }
  .bar {
    height: 26px;
    border-radius: 7px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    overflow: hidden;
    display: flex;
  }
  .bar .yes { background: var(--gold); width: 0%; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .bar .no { background: var(--ember); flex: 1; opacity: .85; }
  .bar-mid {
    position: absolute; top: -4px; bottom: -4px; left: 50%;
    width: 2px; background: rgba(242,237,226,.55);
  }
  .bar-caps {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--slate); margin-top: 6px;
  }
  .bar-caps .y { color: var(--gold); }
  .bar-caps .n { color: var(--ember); }

  /* Signature element: the ruling stamp */
  .stamp-zone { position: relative; min-height: 64px; margin-top: 14px; display: flex; justify-content: center; }
  .stamp {
    position: relative;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 7vw, 34px);
    letter-spacing: .14em;
    padding: 8px 18px 6px;
    border: 3px solid currentColor;
    border-radius: 8px;
    transform: rotate(-6deg) scale(1);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .stamp.qualifies { color: var(--gold); }
  .stamp.dnq { color: var(--ember); }
  /* The anti-label: the trait tag with a line through it. The bar is drawn,
     not text-decoration, so it slams with the stamp and reads at a glance. */
  .stamp.anti::after { content: ""; position: absolute; left: 4%; right: 4%; top: 50%;
    height: 5px; margin-top: -2px; background: var(--ember); transform: rotate(-5deg);
    border-radius: 3px; box-shadow: 0 0 0 1px rgba(16,20,24,.55); }
  .stamp.longtag { font-size: 19px; letter-spacing: .1em; padding-left: 10px; padding-right: 10px; }
  .stamp.disputed { color: var(--paper); border-style: dashed; }
  .stamp.unresolved { color: var(--slate); border-style: dotted; font-size: 20px; letter-spacing: .18em; }
  @media (prefers-reduced-motion: no-preference) {
    .stamp.slam { animation: slam .38s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes slam {
      0% { transform: rotate(-14deg) scale(2.2); opacity: 0; }
      70% { transform: rotate(-5deg) scale(.96); opacity: 1; }
      100% { transform: rotate(-6deg) scale(1); opacity: 1; }
    }
  }
  .rv-why { margin: 12px 0 0; font-size: 13px; color: var(--slate); line-height: 1.45; }
  .rv-changed { color: var(--gold); }

  .btn {
    display: block;
    width: 100%;
    text-align: center;
    appearance: none;
    border: 0;
    border-radius: 12px;
    margin-top: 16px;
    padding: 15px 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .12em;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-primary { background: var(--gold); color: #221a05; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--paper); }

  /* Completion */
  .done-count {
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 12vw, 58px);
    letter-spacing: .04em;
    margin: 4px 0 0;
  }
  .done-sub { text-align: center; color: var(--slate); font-size: 14px; margin: 2px 0 12px; letter-spacing: .1em; }
  .div-head { font-size: 12px; letter-spacing: .18em; color: var(--slate); margin: 14px 0 6px; }
  .div-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-top: 1px solid var(--line);
    font-size: 14.5px; gap: 10px;
  }
  .div-row .who b { font-weight: 600; }
  .div-row .split { font-family: 'IBM Plex Mono', monospace; color: var(--gold); white-space: nowrap; }

  .err-card { text-align: center; }
  .err-card h2 { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .08em; margin: 4px 0 6px; }
  .err-card p { color: var(--slate); font-size: 14px; }

  footer.tr-foot {
    text-align: center;
    font-size: 12px;
    color: var(--slate);
    padding: 8px 16px 22px;
  }
  footer.tr-foot .mono { opacity: .7; }
  .skeleton { text-align: center; color: var(--slate); padding: 42px 0; letter-spacing: .18em; font-size: 13px; }

  button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

<body>
<header class="tr-head">
  <a class="tr-wordmark" href="/?src=traits">TRUE <b>82</b></a>
  <h1 class="tr-title disp">PLAYER TRAITS</h1>
  <p class="tr-strap">Make the call on disputed reputations. <b>Community rulings shape how TRUE 82 scores lineup fit.</b></p>
</header>

<main id="stage">
  <div class="skeleton mono" id="bootMsg">PULLING THE FILES&hellip;</div>
</main>

<footer class="tr-foot">
  <div>Rulings lock in now. Engine effects arrive in a coming build.</div>
  <div class="mono" id="footBuild">TRUE 82 &middot; v44.1</div>
</footer>

<script src="/analytics.js?v=20260725-traits-v44" defer></script>
<script src="/retention-client.js?v=20260725-traits-v44" defer></script>
<script>
(function () {
  "use strict";

  var API = "/api/traits";
  var SESSION_SIZE = 5;
  var stage = document.getElementById("stage");

  var params = new URLSearchParams(location.search || "");
  var pinnedQ = (params.get("q") || "").replace(/[^a-z0-9-]/g, "").slice(0, 80);
  var src = params.get("src") || "";
  var entrySource = src === "home_module" ? "home_module"
    : src === "results_prompt" ? "results_prompt"
    : pinnedQ ? "link" : "direct";

  var questions = [];
  var minVotes = 25;
  var idx = 0;
  var answered = [];        // {id, player, season, trait, response, yes_pct, status}
  var doneIds = [];         // across MAKE 5 MORE loops, for exclude=
  var sessionN = 0;
  var sessionOpen = false;
  var questionShownAt = 0;
  var voteFailures = 0;

  function track(name, props) {
    try { if (typeof window.t82track === "function") window.t82track(name, props || {}); } catch (e) {}
  }
  function sid() {
    try {
      var d = typeof window.t82AnalyticsDebug === "function" ? window.t82AnalyticsDebug() : null;
      return d && d.sid ? String(d.sid) : "";
    } catch (e) { return ""; }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function bbref(name) {
    return "https://www.basketball-reference.com/search/?search=" +
      encodeURIComponent(name) + "&utm_source=true82.net&utm_campaign=traits_question";
  }

  function fetchJson(url, opts) {
    return fetch(url, Object.assign({ credentials: "same-origin" }, opts || {}))
      .then(function (r) { return r.json(); });
  }

  function startSession(pin) {
    sessionN += 1;
    sessionOpen = true;
    idx = 0;
    answered = [];
    stage.innerHTML = '<div class="skeleton mono">PULLING THE FILES&hellip;</div>';
    track("traits_session", {
      surface: "traits", action: sessionN === 1 ? "start" : "again",
      source: entrySource, ordinal: sessionN
    });
    var qs = "op=session";
    if (pin) qs += "&q=" + encodeURIComponent(pin);
    if (doneIds.length) qs += "&exclude=" + encodeURIComponent(doneIds.slice(-24).join(","));
    var s = sid();
    if (s) qs += "&sid=" + encodeURIComponent(s);
    fetchJson(API + "?" + qs).then(function (x) {
      if (!x || !x.ok || !x.questions || !x.questions.length) { renderError(x && x.reason); return; }
      questions = x.questions;
      if (x.rules && x.rules.min_eligible_votes) minVotes = x.rules.min_eligible_votes;
      renderQuestion();
    }).catch(function () { renderError("network"); });
  }

  function renderQuestion() {
    var q = questions[idx];
    if (!q) { renderComplete(); return; }
    questionShownAt = Date.now();
    voteFailures = 0;
    var prompt = q.prompt || ("Could this version of " + lastName(q.player_name) + " give you that for real?");
    stage.innerHTML =
      '<section class="card" aria-live="polite">' +
        '<div class="q-top"><span>MAKE THE CALL</span><span class="prog">' + (idx + 1) + ' OF ' + questions.length + '</span></div>' +
        '<div class="q-season">' + esc(q.season_label) + '</div>' +
        '<h2 class="q-player"><a href="' + bbref(q.player_name) + '" target="_blank" rel="noopener">' + esc(q.player_name) + '</a></h2>' +
        '<div class="q-trait">' + esc(q.trait_name).toUpperCase() + '?</div>' +
        '<p class="q-def">' + esc(q.definition || prompt) + '</p>' +
        '<div class="votes">' +
          '<button class="vote-btn vote-yes" data-v="yes">YES</button>' +
          '<button class="vote-btn vote-no" data-v="no">NO</button>' +
          '<button class="vote-btn vote-unsure" data-v="unsure">NOT SURE</button>' +
        '</div>' +
        '<p class="vote-note" id="voteNote"></p>' +
      '</section>';
    track("traits_question", { surface: "traits", action: "view", ordinal: idx + 1, challenge: q.id });
    Array.prototype.forEach.call(stage.querySelectorAll(".vote-btn"), function (b) {
      b.addEventListener("click", function () { castVote(q, b.getAttribute("data-v")); });
    });
  }

  function castVote(q, response) {
    var buttons = stage.querySelectorAll(".vote-btn");
    Array.prototype.forEach.call(buttons, function (b) { b.disabled = true; });
    var note = document.getElementById("voteNote");
    if (note) { note.textContent = "COUNTING\u2026"; note.classList.remove("err"); }
    var elapsed = Math.max(0, Date.now() - questionShownAt);
    fetchJson(API, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ op: "vote", question_id: q.id, response: response, source: entrySource, sid: sid() })
    }).then(function (x) {
      if (x && x.ok === false && x.reason === "rate_limited") {
        // The pace fence, not a network miss. Name it and let them retap.
        Array.prototype.forEach.call(buttons, function (b) { b.disabled = false; });
        if (note) { note.textContent = "EASY, SCOUT. ONE BEAT BETWEEN CALLS."; note.classList.remove("err"); }
        return;
      }
      if (!x || !x.ok || !x.consensus) throw new Error((x && x.reason) || "vote_failed");
      track("traits_vote", {
        surface: "traits", action: response, outcome: x.outcome || "counted",
        ordinal: idx + 1, challenge: q.id, value: elapsed
      });
      recordAnswer(q, response, x.consensus);
      renderReveal(q, response, x.consensus, x.outcome);
    }).catch(function () {
      voteFailures += 1;
      if (voteFailures >= 2) {
        // Never trap a voter behind a dead endpoint. Log the miss, move on.
        track("traits_vote", { surface: "traits", action: response, outcome: "error", ordinal: idx + 1, challenge: q.id, value: elapsed });
        recordAnswer(q, response, null);
        renderReveal(q, response, null, "error");
        return;
      }
      Array.prototype.forEach.call(buttons, function (b) { b.disabled = false; });
      if (note) { note.textContent = "CALL DID NOT LAND. TAP AGAIN."; note.classList.add("err"); }
    });
  }

  function recordAnswer(q, response, consensus) {
    doneIds.push(q.id);
    answered.push({
      id: q.id,
      player: q.player_name,
      season: q.season_label,
      trait: q.trait_name,
      response: response,
      yes_pct: consensus && consensus.yes_pct != null ? consensus.yes_pct : null,
      status: consensus ? consensus.status : "unknown"
    });
  }

  function verdict(consensus, q) {
    if (!consensus) return { cls: "unresolved", label: "CALL NOT COUNTED", why: "The tally is unreachable right now, so this call did not count toward the ruling. The next question is still live." };
    var pct = consensus.yes_pct;
    var who = lastName(q.player_name);
    var tag = (q.trait_name || "").toUpperCase();
    if (consensus.status === "qualifies") return {
      cls: "qualifies", label: tag, tagged: true,
      why: who + " wears the label. The community has ruled."
    };
    if (consensus.status === "does_not_qualify") return {
      cls: "dnq anti", label: tag, tagged: true, aria: "NOT " + tag,
      why: "The crossed-out tag is a ruling too. The community says " + who + " is NOT " + tag + "."
    };
    if (consensus.status === "disputed") return {
      cls: "disputed", label: "DISPUTED",
      why: "Too close to call. This ruling stays open and settles as more calls come in."
    };
    var need = consensus.votes_needed != null ? consensus.votes_needed : minVotes;
    return {
      cls: "unresolved", label: need + " MORE CALL" + (need === 1 ? "" : "S"),
      why: "Not enough calls yet. At " + minVotes + " the community makes this ruling."
    };
  }

  function renderReveal(q, response, consensus, outcome) {
    var v = verdict(consensus, q);
    var pct = consensus && consensus.yes_pct != null ? consensus.yes_pct : null;
    var unsure = consensus ? (consensus.unsure_count || 0) : 0;
    var last = idx + 1 >= questions.length;
    var pctLine = pct == null
      ? "You called it: <b class=\"pct\">" + response.toUpperCase() + "</b>."
      : "<b class=\"pct\">" + pct + "%</b> of " + (consensus.eligible_votes || 0) + " calls say yes." +
        (unsure ? " <span class=\"mono\">+" + unsure + " not sure</span>." : "");
    stage.innerHTML =
      '<section class="card" aria-live="polite">' +
        '<div class="q-top"><span>THE RULING</span><span class="prog">' + (idx + 1) + ' OF ' + questions.length + '</span></div>' +
        '<div class="q-season">' + esc(q.season_label) + '</div>' +
        '<h2 class="q-player">' + esc(q.player_name) + '</h2>' +
        '<div class="q-trait">' + esc(q.trait_name).toUpperCase() + '?</div>' +
        '<p class="rv-line">' + pctLine +
          (outcome === "changed" ? ' <span class="rv-changed">CALL CHANGED.</span>' : '') + '</p>' +
        (pct == null ? '' :
          '<div class="bar-wrap"><div class="bar"><div class="yes" id="barYes"></div><div class="no"></div></div><div class="bar-mid" aria-hidden="true"></div></div>' +
          '<div class="bar-caps"><span class="y">YES ' + pct + '%</span><span class="n">NO ' + (100 - pct) + '%</span></div>') +
        '<div class="stamp-zone"><span class="stamp slam ' + v.cls +
          (v.tagged && v.label.length > 14 ? ' longtag' : '') + '"' +
          (v.aria ? ' role="img" aria-label="' + esc(v.aria) + '"' : '') + '>' + esc(v.label) + '</span></div>' +
        '<p class="rv-why">' + esc(v.why) + '</p>' +
        '<button class="btn btn-primary" id="nextBtn">' + (last ? "SEE YOUR SESSION" : "NEXT CALL") + '</button>' +
      '</section>';
    track("traits_question", { surface: "traits", action: "result_view", ordinal: idx + 1, challenge: q.id, outcome: consensus ? consensus.status : "offline" });
    var yesBar = document.getElementById("barYes");
    if (yesBar && pct != null) requestAnimationFrame(function () { yesBar.style.width = pct + "%"; });
    document.getElementById("nextBtn").addEventListener("click", function () {
      idx += 1;
      if (idx >= questions.length) renderComplete(); else renderQuestion();
    });
  }

  function renderComplete() {
    sessionOpen = false;
    var divided = answered.filter(function (a) { return a.yes_pct != null; })
      .sort(function (a, b) { return Math.abs(a.yes_pct - 50) - Math.abs(b.yes_pct - 50); })
      .slice(0, 2);
    var divHtml = divided.length
      ? '<div class="div-head mono">TIGHTEST CALLS THIS SESSION</div>' +
        divided.map(function (a) {
          return '<div class="div-row"><span class="who">' + esc(a.season) + ' <b>' + esc(a.player) + '</b> &middot; ' + esc(a.trait) + '</span>' +
            '<span class="split">' + a.yes_pct + '/' + (100 - a.yes_pct) + '</span></div>';
        }).join("")
      : "";
    stage.innerHTML =
      '<section class="card">' +
        '<p class="done-count disp">' + answered.length + ' CALLS MADE</p>' +
        '<p class="done-sub mono">RULINGS RECORDED</p>' +
        divHtml +
        '<button class="btn btn-primary" id="moreBtn">MAKE 5 MORE CALLS</button>' +
        '<a class="btn btn-ghost" id="playBtn" href="/?src=traits">PLAY TRUE 82</a>' +
      '</section>';
    track("traits_session", { surface: "traits", action: "complete", ordinal: answered.length, source: entrySource });
    document.getElementById("moreBtn").addEventListener("click", function () { startSession(""); });
    document.getElementById("playBtn").addEventListener("click", function () {
      track("traits_session", { surface: "traits", action: "play_game", ordinal: answered.length, source: entrySource });
    });
  }

  function renderError(reason) {
    sessionOpen = false;
    stage.innerHTML =
      '<section class="card err-card">' +
        '<h2 class="disp">SCOUTING DESK IS DARK</h2>' +
        '<p>The question feed did not answer. The game itself is unaffected.</p>' +
        '<button class="btn btn-primary" id="retryBtn">TRY AGAIN</button>' +
        '<a class="btn btn-ghost" href="/?src=traits">PLAY TRUE 82</a>' +
      '</section>';
    track("traits_session", { surface: "traits", action: "feed_error", source: entrySource, outcome: String(reason || "unknown").slice(0, 40) });
    document.getElementById("retryBtn").addEventListener("click", function () { startSession(pinnedQ); });
  }

  function lastName(full) {
    var parts = String(full || "").trim().split(/\s+/);
    return parts.length ? parts[parts.length - 1] : full;
  }

  window.addEventListener("pagehide", function () {
    if (sessionOpen && answered.length < SESSION_SIZE) {
      track("traits_session", { surface: "traits", action: "exit", ordinal: answered.length, source: entrySource });
    }
  });

  // First question within seconds: no modal, no tour. The strap line above the
  // card carries the consequence; the first card carries everything else.
  startSession(pinnedQ);
})();
</script>
</body>
</html>
