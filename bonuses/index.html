/* ---------- v60 THE VOTE ROOM (the owner: the voting screen gets "the same satisfying breed of graphics and
   momentous, highly stylized visual rewards" as the reel, the home card and the draft, "bigger stylistic swings").
   The masthead prints in two inks. A counter and the set's five ink diamonds ride over the card, which stands on
   a halftone offset shadow. A vote slams its answer onto the card as a two-ink rubber stamp with a halftone ring and
   ink drops, and the card jolts under it; then the result prints: the percent in two inks, the verdict stamped
   on, the tally rolled in like ink. Each vote prints its diamond and ticks the counter; the set's fifth re-inks the
   row and prints the running count. The keyframes it borrows live in styles.css (rdpSlam, rdpPlatePink and
   rdpPlateAqua, rdpRing, rdpConf, rdpShake, ink-*). prefers-reduced-motion lands every end state at once. ---------- */

.pb-ink{position:relative;isolation:isolate}
.pb-ink::before,.pb-ink::after{content:attr(data-ink);position:absolute;left:0;top:0;right:0;z-index:-1;pointer-events:none;
  color:transparent;-webkit-background-clip:text;background-clip:text;background-size:4px 4px;white-space:nowrap}
.pb-ink::before{background-image:radial-gradient(circle,var(--p1,var(--t-accent)) 1.35px,transparent 1.85px);transform:translate(5px,5px)}
.pb-ink::after{background-image:radial-gradient(circle,var(--p2,var(--t-offset)) 1.15px,transparent 1.65px);transform:translate(-3px,-2px);opacity:.85}
.pb-mast.pb-ink::before{background-size:3.5px 3.5px;transform:translate(4px,4px)}
.pb-mast.pb-ink::after{background-size:3.5px 3.5px;transform:translate(-2px,-2px)}
.pb-print{animation:rdpSlam .34s cubic-bezier(.2,.9,.3,1.3) both}
.pb-print::before{animation:rdpPlatePink .64s cubic-bezier(.25,.9,.3,1) both}
.pb-print::after{animation:rdpPlateAqua .64s cubic-bezier(.25,.9,.3,1) .04s both}
/* the meter: the running count in the display face, the set's diamonds */
.pb-meter{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 2px 14px}
.pb-meter[hidden]{display:none}
.pb-count{display:flex;align-items:center;gap:9px}
.pb-count b{font-family:var(--t-disp);font-weight:900;font-size:40px;line-height:.85;letter-spacing:.02em;color:var(--t-text);font-variant-numeric:tabular-nums}
.pb-count span{font-family:var(--t-mono);font-size:10.5px;line-height:1.25;letter-spacing:.18em;text-transform:uppercase;color:var(--t-text-2)}
.pb-dias{gap:13px;padding:4px 6px 4px 4px}
.pb-dias>i{width:13px;height:13px}
.pb-dias>i::before{transform:translate(3px,0)}
/* the card on its halftone offset shadow (the home's .hm-ht). look.css prints .wrap .card as a see-through outline
   card, which would show the dots through it, so the vote room's card is solid ground under the same white rule
   (the doubled id in :is() outranks look.css's) */
.pb-ht{--off:7px;--r:23px;--dot:rgb(var(--t-accent-rgb) / .42)}
html[data-card] .wrap :is(#pb-k#pb-k,.pb-card){background:linear-gradient(rgb(var(--t-ground-2-rgb) / .5),rgb(var(--t-ground-2-rgb) / .5)),var(--t-ground);
  border:2px solid rgb(var(--t-text-rgb) / .85);border-radius:23px;box-shadow:none}
.pb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;min-height:24px}
.pb-eyebrow{font-family:var(--t-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--t-text-2);white-space:nowrap}
/* the stamp: the answer slams onto the card, a two-ink rubber stamp at a tilt, with a halftone ring and ink drops */
.card.is-hit{animation:rdpShake .34s ease both}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgb(var(--t-light-rgb) / .9) 1.4px,transparent 2px) 0 0 / 6px 6px}
.card.is-hit::after{animation:rdpRoom .36s ease-out both}
.pb-stamp{position:absolute;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;overflow:visible}
.pb-stamp.is-yes{--k:var(--t-offset);--p1:var(--t-accent);--p2:var(--t-light)}
.pb-stamp.is-no{--k:var(--t-accent);--p1:var(--t-offset);--p2:var(--t-light)}
.pb-stamp.is-unsure{--k:var(--t-text-2);--p1:var(--t-accent);--p2:var(--t-offset)}
.pb-stamp-tilt{transform:rotate(-9deg)}
.pb-stamp b{display:block;padding:2px 14px 0;border:6px solid var(--k);border-radius:18px;color:var(--k);background:rgb(var(--t-ground-rgb) / .62);
  font-family:var(--t-disp);font-weight:900;font-size:clamp(78px,24vw,112px);line-height:.95;letter-spacing:.04em;text-transform:uppercase;
  text-shadow:0 0 26px rgb(var(--t-ground-rgb) / .8);box-shadow:0 0 0 3px rgb(var(--t-ground-rgb) / .5),0 16px 40px -12px rgb(var(--t-shadow-rgb) / .7);
  animation:rdpSlam .3s cubic-bezier(.2,.9,.3,1.3) both}
.pb-stamp.is-unsure b{font-size:clamp(52px,16vw,74px)}
.pb-stamp b::before,.pb-stamp b::after{padding:inherit}
.pb-stamp b::before{animation:rdpPlatePink .6s cubic-bezier(.25,.9,.3,1) both}
.pb-stamp b::after{animation:rdpPlateAqua .6s cubic-bezier(.25,.9,.3,1) .04s both}
.pb-ring{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;opacity:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--k) 2.2px,transparent 2.8px);background-size:7px 7px;
  -webkit-mask-image:radial-gradient(circle closest-side,transparent 50%,var(--fx-mask) 60%,var(--fx-mask) 80%,transparent 100%);
  mask-image:radial-gradient(circle closest-side,transparent 50%,var(--fx-mask) 60%,var(--fx-mask) 80%,transparent 100%);
  animation:rdpRing .86s cubic-bezier(.12,.75,.3,1) .04s both}
.pb-ring::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;
  background-image:radial-gradient(circle,var(--p1) 2.2px,transparent 2.8px);background-size:7px 7px;
  animation:ink-ring2 .86s cubic-bezier(.12,.75,.3,1) .1s both}
.pb-conf{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.pb-conf i{position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);border-radius:50%;opacity:0;
  animation:rdpConf 1.1s cubic-bezier(.15,.7,.35,1) var(--dl) both}
.pb-conf i.c0,.pb-conf i.c2{background:var(--t-accent)}
.pb-conf i.c1{background:var(--t-offset)}
.pb-conf i.c3{background:var(--t-light)}
.pb-stamp.is-lift{animation:pbLift .36s ease-in both}
@keyframes pbLift{to{opacity:0;transform:translateY(-30px) scale(.82)}}
/* the result prints: the percent in two inks, the verdict stamped on, the tally rolled in */
.pb-res{outline:none}
.pb-early{font-family:var(--t-mono);font-size:12px;letter-spacing:.24em;color:var(--t-text-2);margin:0 0 6px}
.pb-big{display:inline-block;font-family:var(--t-disp);font-weight:900;font-size:clamp(56px,16vw,72px);line-height:.95;letter-spacing:.02em;

.pb-big.is-yes{color:var(--t-offset);--p1:var(--t-accent);--p2:var(--t-light)}
.pb-big.is-no{color:var(--t-accent);--p1:var(--t-offset);--p2:var(--t-light)}
.pb-big.is-early{font-size:clamp(40px,11vw,52px)}
.pb-res .pb-up{animation:rdpUp .3s ease-out both}
.pb-res .pb-up.d1{animation-delay:.12s}.pb-res .pb-up.d2{animation-delay:.2s}.pb-res .pb-up.d3{animation-delay:.28s}.pb-res .pb-up.d4{animation-delay:.36s}
.pb-verdict{display:flex;margin:0 0 14px}
.pb-verdict .r-chip{transform:rotate(-4deg);animation:pbChip .46s cubic-bezier(.2,.9,.3,1.3) .3s both}
@keyframes pbChip{0%{opacity:0;transform:rotate(-4deg) scale(2.3)}60%{opacity:1;transform:rotate(-4deg) scale(.92)}100%{opacity:1;transform:rotate(-4deg) scale(1)}}
.pb-bar{margin:0 0 16px;height:12px;border-radius:6px}
/* the set is in: the running count prints big, the diamonds re-ink, a ring throws */
.pb-done{position:relative;margin-top:4px}
.pb-done-head{display:inline-block;font-family:var(--t-disp);font-weight:900;font-size:clamp(46px,13vw,60px);line-height:.95;letter-spacing:.03em;

.pb-done-burst{position:absolute;left:34%;top:26px;--k:var(--t-accent);--p1:var(--t-offset)}
.pb-empty .q{font-size:30px}
@media (prefers-reduced-motion:reduce){
  .pb-print,.pb-print::before,.pb-print::after,.card.is-hit,.card.is-hit::after,.pb-res .pb-up,.pb-verdict .r-chip,.pb-done-burst *{animation:none}
  .pb-print::before,.pb-print::after{opacity:1}
  .skel .sk{animation:none}
}

      })();
    }
    if (counted) meterPaint(true);
    if (last) {
      var head = document.getElementById("pbDoneHead"), burst = document.querySelector("#pbDone .pb-done-burst");
      setTimeout(function () {
        replay(head, "pb-print");
        if (burst && !reduceMotion) {
          burst.innerHTML = '<i class="pb-ring"></i><span class="pb-conf">' + confettiHtml(18) + "</span>";
          setTimeout(function () { burst.innerHTML = ""; }, 1400);
        }
      }, 420);
    }
    hapticTick(last ? [12, 70, 12] : 10);
    track("traits_question", { surface: "traits", action: "result_view", ordinal: idx + 1, challenge: q.id, outcome: d.status, value: early ? 1 : 0, source: entrySource });
    seenAdd(q.id);
    var nextBtn = document.getElementById("nextBtn");
    if (nextBtn) hapticOverlay(nextBtn);
    if (nextBtn) nextBtn.addEventListener("click", function () {
      track("traits_question", { surface: "traits", action: "next", ordinal: idx + 1, challenge: q.id, source: entrySource });
      idx++; renderQuestion();
    });
    var moreBtn = document.getElementById("moreBtn");
    if (moreBtn) hapticOverlay(moreBtn);
    if (moreBtn) {
      completedOnce = true; sessionOpen = false;
      track("traits_session", { surface: "traits", action: "complete", value: doneIds.length, source: entrySource });
      moreBtn.addEventListener("click", function () { startSession("", true); });
    }
    var shareBtn = document.getElementById("shareBtn");
    if (shareBtn) shareBtn.addEventListener("click", function () { shareQuestion(q, resp, d); });
    var cvBtn = document.getElementById("cvBtn");
    if (cvBtn) cvBtn.addEventListener("click", function () {
      // Standing votes are revisable: rebuild the live controls with the
      // current answer pressed, and the next tap records outcome "changed".
      track("traits_question", { surface: "traits", action: "change_open", ordinal: idx + 1, challenge: q.id, source: entrySource });
      q.my_response = null;
      renderQuestion();
      var prev = document.querySelector('[data-v="' + resp + '"]');
      if (prev) prev.classList.add("pressed");
    });
  }

  function shareQuestion(q, resp, d, btn) {
    var url = location.origin + "/bonuses/" + (q.slug || ("?q=" + encodeURIComponent(q.id))) + (q.slug ? "?src=s" : "&src=s");
    var text;
    var pq = questionText(q);
    // No yes or no votes yet (only an UNSURE), or a percent with nobody else
    // behind it: no tally to brag about, so just invite the vote.
    var elig = d ? (d.yes || 0) + (d.no || 0) : 0;
    if (!d || !elig || (d.mode !== "counts" && (d.yes_pct == null || elig < 2))) text = "Vote on this one: " + pq;
    else if (d.mode === "counts") text = "Early vote is " + d.yes + "–" + d.no + ": " + pq;
    else if (resp === "yes") text = "I voted yes: " + pq + " " + d.yes_pct + "% currently say yes.";
    else if (resp === "no") text = "I voted no, and " + (100 - d.yes_pct) + "% agree: " + pq;
    else text = d.yes_pct + "% say yes: " + pq;
    if (navigator.share) {
      navigator.share({ text: text, url: url }).then(function () {
        track("traits_question", { surface: "traits", action: "share_open", challenge: q.id, source: entrySource });
      }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text + "\n" + url).then(function () {
        var f = document.getElementById("flash");
        if (f) f.textContent = "LINK COPIED";
        else if (btn) {
          // COPIED takes the lead's place (and its 21px size); the small
          // part steps out. The button's haptic switch stays untouched.
          var lead = btn.querySelector(".qx-lead"), sub = btn.querySelector(".qx-sub");
          if (lead) {
            if (!btn.dataset.shareLabel) btn.dataset.shareLabel = lead.textContent;
            lead.textContent = "COPIED";
            if (sub) sub.hidden = true;
          }
          btn.classList.add("flashed");
          clearTimeout(btn._copiedT);
          btn._copiedT = setTimeout(function () {
            if (lead) lead.textContent = btn.dataset.shareLabel;
            if (sub) sub.hidden = false;
            btn.classList.remove("flashed");
          }, 1400);
        }
        track("traits_question", { surface: "traits", action: "share_copy", challenge: q.id, source: entrySource });
      }).catch(function () {});
    }
  }

  function renderComplete() { /* reached only if Q ran short */ startSession("", true); }

  window.addEventListener("pagehide", function () {
    if (sessionOpen && !completedOnce && doneIds.length < 5) {
      track("traits_session", { surface: "traits", action: "exit", value: doneIds.length, ordinal: idx + 1, source: entrySource });
    }
  });

  replay(document.getElementById("pbMast"), "pb-print");
  if (preload && preload.id) {
    Q = [preload]; idx = 0; sessionOpen = true;
    track("traits_session", { surface: "traits", action: "start", source: entrySource || "link" });
    renderQuestion();
    identityReady().then(function () {
      return deal(preload.id, excludeIds(preload.id, true));
    }).then(function (x) {
      if (x && x.ok && x.questions && x.questions.length) {
        var mine = Q[0];
        Q = x.questions;
        if (Q[0] && Q[0].id !== mine.id) Q.unshift(mine);
        Q = Q.slice(0, 5);
        meterPaint(false);
        var top = document.querySelector("#qcard .pb-eyebrow");
        if (top && Q[idx] === mine) top.textContent = "Player bonus · " + (idx + 1) + " of " + Q.length;
      }
    }).catch(function () {});
  } else {
    startSession(pinnedRef);
  }
})();
</script>
</body>
</html>
