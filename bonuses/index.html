          '<a class="qx-btn t-btn" data-kind="quiet" id="qRef" hidden target="_blank" rel="noopener">Stats Refresher \u2197</a>' +
          '<button class="qx-btn qx-share t-btn" data-kind="quiet" id="qShare" type="button">' +
            '<span class="qx-lead">Share Vote</span><span class="qx-sub">(please don\u2019t vote brigade)</span></button>' +
          '<a class="qx-btn qx-play t-btn" href="/?src=bonuses">PLAY THE GAME</a>' +
        "</div>" +
      "</section>";
    setTitleTag(q);
    track("traits_question", { surface: "traits", action: "view", ordinal: n, challenge: q.id, source: entrySource });
    var card = document.getElementById("qcard");
    var qRef = document.getElementById("qRef");
    if (qRef && q.player_name) {
      qRef.href = bbPlayerHref(q.player_name);
      qRef.hidden = false;
      bbMap().then(function () {
        var a = document.getElementById("qRef");
        if (a && Q[idx] === q) a.href = bbPlayerHref(q.player_name);
      });
    }
    var qShare = document.getElementById("qShare");
    if (qShare) qShare.addEventListener("click", function () { shareQuestion(q, null, null, qShare); });
    if (qShare) hapticOverlay(qShare);
    Array.prototype.forEach.call(card.querySelectorAll("[data-v]"), function (b) {
      b.addEventListener("click", function () { castVote(q, b.getAttribute("data-v"), b); });
      hapticOverlay(b);
    });
    if (q.my_response) {
      api("/api/traits?op=result&q=" + encodeURIComponent(q.id) + "&sid=" + sid).then(function (x) {
        if (x && x.ok && x.display) showResult(q, q.my_response, x.display, true);
      }).catch(function () {});
    }
  }

  // The server turns away a second vote from the same voter inside 1.2s
  // (rate_limited). Like the results ballot, votes go out at least 1.3s
  // apart, counted from the last reply, and a rate_limited reply waits and
  // sends again (twice at most) instead of failing a quick second vote.
  var VOTE_GAP_MS = 1300, lastVoteAt = 0;
  function castVote(q, resp, btn, isRetry) {
    var controls = document.getElementById("controls");
    var card = document.getElementById("qcard");
    if (!controls) return;
    if (controls.classList.contains("locked") && !isRetry) return;
    controls.classList.add("locked");
    btn.classList.add("pressed");
    var started = Date.now(), tries = 0;
    // A slow reply swaps only the label's text for "\u2026" (like COPIED), so the
    // button's haptic switch and its listeners stay in place.
    var label = null, saved = null;
    for (var n = btn.firstChild; n && !label; n = n.nextSibling) if (n.nodeType === 3 && n.nodeValue.trim()) label = n;
    var slow = setTimeout(function () { if (label) { saved = label.nodeValue; label.nodeValue = "\u2026"; } }, 400);
    var minH = controls.offsetHeight;
    function settle() {
      lastVoteAt = Date.now();
      clearTimeout(slow);
      if (label && saved != null) { label.nodeValue = saved; saved = null; }
    }
    function send() {
      var wait = lastVoteAt + VOTE_GAP_MS - Date.now();
      if (wait > 0) { setTimeout(send, wait); return; }
      lastVoteAt = Date.now();
      if (!tries) started = lastVoteAt;         // the vote's time, not the deliberate spacing wait
      fetch("/api/traits", {
        method: "POST", credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ op: "vote", question_id: q.id, response: resp, source: entrySource, sid: sid })
      }).then(function (r) { return r.json(); }).then(function (x) {
        lastVoteAt = Date.now();
        if (x && !x.ok && x.reason === "rate_limited" && tries < 2) { tries++; send(); return; }
        settle();
        if (!x || !x.ok || !x.display) return voteFailed(q, resp, btn, x && x.reason);
        lastAnswered = q;
        track("traits_vote", { surface: "traits", action: resp, ordinal: idx + 1, challenge: q.id, outcome: x.outcome, value: Date.now() - started, source: entrySource });
        showResult(q, resp, x.display, false, minH);
      }).catch(function () {
        settle();
        voteFailed(q, resp, btn, "network");
      });
    }
    send();
  }

  function voteFailed(q, resp, btn, reason) {
    track("traits_question", { surface: "traits", action: "try_again", ordinal: idx + 1, challenge: q.id, outcome: String(reason || "unknown").slice(0, 40) });
    var zone = document.getElementById("resultZone");
    zone.innerHTML = '<p class="err-line">Vote didn\u2019t send.</p>' +
      '<button class="act-next t-btn" id="tryBtn">TRY AGAIN</button>';
    document.getElementById("tryBtn").addEventListener("click", function () {
      zone.innerHTML = "";
      castVote(q, resp, btn, true);
    });
  }

  function showResult(q, resp, d, preVoted, minH) {
    lastAnswered = q;
    var controls = document.getElementById("controls");
    var zone = document.getElementById("resultZone");
    var early = d.mode === "counts";
    var big, cls;
    if (early) { big = d.yes + " YES \u00b7 " + d.no + " NO"; cls = "early"; }
    else if ((d.yes_pct || 0) >= 50) { big = d.yes_pct + "% YES"; cls = "yes"; }
    else { big = (100 - d.yes_pct) + "% NO"; cls = "no"; }
    var elig = (d.yes || 0) + (d.no || 0), total = elig + (d.unsure || 0);
    // The tally counts this vote too, so "% agree" needs at least one other
    // voter in its count (yes and no for a yes or no, everyone for UNSURE).
    // Alone, it would be "100% agree" with nobody else there.
    var pool = resp === "unsure" ? total : elig;
    var you = "You voted " + resp.toUpperCase() +
      (d.agree_pct != null && pool > 1 ? " \u00b7 " + d.agree_pct + "% agree" : total <= 1 ? " \u00b7 first vote" : "");
    var barHtml = elig > 0
      ? '<div class="bar" aria-hidden="true"><span class="y" style="width:' + Math.round(100 * d.yes / elig) + '%"></span><span class="n" style="flex:1"></span></div>' : "";
    var changeHtml = '<button class="cv-link t-btn" data-kind="text" id="cvBtn">CHANGE VOTE</button>';
    var last = idx >= Q.length - 1;
    var actions = last
      ? '<p class="done-head" style="margin-top:4px">' + Q.length + (Q.length === 1 ? ' VOTE IN' : ' VOTES IN') + '</p>' +
        '<p class="done-line">Your votes helped set player bonuses.</p>' +
        '<button class="act-next t-btn" id="moreBtn">VOTE ON 5 MORE</button>' +
        '<button class="act-share t-btn" data-kind="quiet" id="shareBtn">SHARE LAST QUESTION</button>' +
        '<a class="act-share t-btn" data-kind="quiet" href="/?src=bonuses">BACK TO TRUE 82</a>'
      : '<button class="act-next t-btn" id="nextBtn">NEXT QUESTION</button>' +
        '<button class="act-share t-btn" data-kind="quiet" id="shareBtn">SHARE QUESTION</button>';
    zone.innerHTML =
      '<div class="result seq" tabindex="-1"' + (minH ? ' style="min-height:' + minH + 'px"' : "") + ">" +
        '<div class="rv">' + (early ? '<p class="r-eyebrow">EARLY RESULT</p>' : "") +
          '<p class="r-big ' + cls + '" id="rBig">' + big + "</p></div>" +
        '<div class="rv"><p class="r-you">' + esc(you) + "</p></div>" +
        '<div class="rv">' + statusChip(d.status) + "</div>" +
        (barHtml ? '<div class="rv">' + barHtml + "</div>" : "") +
        '<div class="rv">' + changeHtml + "</div>" +
        '<div class="rv">' + actions + "</div>" +
        '<div class="rv"><p class="flash" id="flash" role="status"></p></div>' +
      "</div>";
    if (controls) controls.remove();
    var qx = document.getElementById("qx");
    if (qx) qx.remove();
    var rEl = zone.querySelector(".result");
    requestAnimationFrame(function () {
      if (!rEl) return;
      rEl.classList.add("show");
      try { rEl.focus({ preventScroll: true }); } catch (e) { try { rEl.focus(); } catch (e2) {} }
      var yFill = rEl.querySelector(".bar .y");
      if (yFill) {
        var w = yFill.style.width;
        if (!reduceMotion) {
          yFill.style.width = "0%";
          requestAnimationFrame(function () { yFill.style.width = w; });
        }
      }
    });
    if (!early && !reduceMotion && window.matchMedia) {
      (function () {
        var bigEl = document.getElementById("rBig");
        var target = parseInt(big, 10);
        var tail = big.slice(String(target).length);
        if (!bigEl || !isFinite(target)) return;
        var t0 = null;
        function step(ts) {
          if (t0 === null) t0 = ts;
          var k = Math.min(1, (ts - t0) / 500);
          var eased = 1 - Math.pow(1 - k, 3);
          bigEl.textContent = Math.round(target * eased) + tail;
          if (k < 1) requestAnimationFrame(step); else bigEl.textContent = big;
        }
        requestAnimationFrame(step);
      })();
    }
    hapticTick(last ? [12, 70, 12] : 10);
    track("traits_question", { surface: "traits", action: "result_view", ordinal: idx + 1, challenge: q.id, outcome: d.status, value: early ? 1 : 0, source: entrySource });
    if (!preVoted && q.id) { if (doneIds.indexOf(q.id) < 0) doneIds.push(q.id); }
    seenAdd(q.id);
    var nextBtn = document.getElementById("nextBtn");
    if (nextBtn) hapticOverlay(nextBtn);
    if (nextBtn) nextBtn.addEventListener("click", function () {
      track("traits_question", { surface: "traits", action: "next", ordinal: idx + 1, challenge: q.id, source: entrySource });
      idx++; renderQuestion();
    });
    var moreBtn = document.getElementById("moreBtn");
    if (moreBtn) hapticOverlay(moreBtn);
    if (moreBtn) {
      completedOnce = true; sessionOpen = false;
      track("traits_session", { surface: "traits", action: "complete", value: doneIds.length, source: entrySource });
      moreBtn.addEventListener("click", function () { startSession("", true); });
    }
    var shareBtn = document.getElementById("shareBtn");
    if (shareBtn) shareBtn.addEventListener("click", function () { shareQuestion(q, resp, d); });
    var cvBtn = document.getElementById("cvBtn");
    if (cvBtn) cvBtn.addEventListener("click", function () {
      // Standing votes are revisable: rebuild the live controls with the
      // current answer pressed, and the next tap records outcome "changed".
      track("traits_question", { surface: "traits", action: "change_open", ordinal: idx + 1, challenge: q.id, source: entrySource });
      if (preVoted || doneIds.indexOf(q.id) >= 0) { /* stays counted toward the session */ }
      q.my_response = null;
      renderQuestion();
      var prev = document.querySelector('[data-v="' + resp + '"]');
      if (prev) prev.classList.add("pressed");
    });
  }

  function shareQuestion(q, resp, d, btn) {
    var url = location.origin + "/bonuses/" + (q.slug || ("?q=" + encodeURIComponent(q.id))) + (q.slug ? "?src=s" : "&src=s");
    var text;
    var pq = questionText(q);
    // No yes or no votes yet (only an UNSURE), or a percent with nobody else
    // behind it: no tally to brag about, so just invite the vote.
    var elig = d ? (d.yes || 0) + (d.no || 0) : 0;
    if (!d || !elig || (d.mode !== "counts" && (d.yes_pct == null || elig < 2))) text = "Vote on this one: " + pq;
    else if (d.mode === "counts") text = "Early vote is " + d.yes + "\u2013" + d.no + ": " + pq;
    else if (resp === "yes") text = "I voted yes: " + pq + " " + d.yes_pct + "% currently say yes.";
    else if (resp === "no") text = "I voted no, and " + (100 - d.yes_pct) + "% agree: " + pq;
    else text = d.yes_pct + "% say yes: " + pq;
    if (navigator.share) {
      navigator.share({ text: text, url: url }).then(function () {
        track("traits_question", { surface: "traits", action: "share_open", challenge: q.id, source: entrySource });
      }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text + "\n" + url).then(function () {
        var f = document.getElementById("flash");
        if (f) f.textContent = "LINK COPIED";
        else if (btn) {
          // COPIED takes the lead's place (and its 21px size); the small
          // part steps out. The button's haptic switch stays untouched.
          var lead = btn.querySelector(".qx-lead"), sub = btn.querySelector(".qx-sub");
          if (lead) {
            if (!btn.dataset.shareLabel) btn.dataset.shareLabel = lead.textContent;
            lead.textContent = "COPIED";
            if (sub) sub.hidden = true;
          }
          btn.classList.add("flashed");
          clearTimeout(btn._copiedT);
          btn._copiedT = setTimeout(function () {
            if (lead) lead.textContent = btn.dataset.shareLabel;
            if (sub) sub.hidden = false;
            btn.classList.remove("flashed");
          }, 1400);
        }
        track("traits_question", { surface: "traits", action: "share_copy", challenge: q.id, source: entrySource });
      }).catch(function () {});
    }
  }

  function renderComplete() { /* reached only if Q ran short */ startSession("", true); }

  window.addEventListener("pagehide", function () {
    if (sessionOpen && !completedOnce && doneIds.length < 5) {
      track("traits_session", { surface: "traits", action: "exit", value: doneIds.length, ordinal: idx + 1, source: entrySource });
    }
  });

  if (preload && preload.id) {
    Q = [preload]; idx = 0; sessionOpen = true;
    track("traits_session", { surface: "traits", action: "start", source: entrySource || "link" });
    renderQuestion();
    identityReady().then(function () {
      return api("/api/traits?op=session&sid=" + sid + "&q=" + encodeURIComponent(preload.id));
    }).then(function (x) {
      if (x && x.ok && x.questions && x.questions.length) {
        var mine = Q[0];
        Q = x.questions;
        if (Q[0] && Q[0].id !== mine.id) Q.unshift(mine);
        Q = Q.slice(0, 5);
      }
    }).catch(function () {});
  } else {
    startSession(pinnedRef);
  }
})();
</script>
</body>
</html>
